version: "3.9"

services:
  db:
    image: postgres:16
    container_name: tarefas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: tarefas
      POSTGRES_DB: tarefas_db
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./import.sql:/docker-entrypoint-initdb.d/import.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarefas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarefas-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/tarefas_db
      QUARKUS_DATASOURCE_USERNAME: tarefas
      QUARKUS_DATASOURCE_PASSWORD: tarefas
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  dbdata: